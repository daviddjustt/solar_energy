<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; margin-bottom: 30px; }
        .header img { max-width: 180px; height: auto; }
        .content { min-height: 150px; }
        .footer { border-top: 2px solid #f0f0f0; padding-top: 20px; margin-top: 30px; font-size: 0.85em; color: #888; text-align: center; }
        .btn { display: inline-block; background-color: #007bff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
        .alert-box { background-color: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin: 20px 0; border-radius: 4px; }
        .success-box { background-color: #d4edda; border-left: 4px solid #28a745; padding: 15px; margin: 20px 0; border-radius: 4px; }
        .info-table { width: 100%; border-collapse: collapse; margin: 20px 0; background-color: #f9f9f9; border-radius: 4px; }
        .info-table td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        .info-table td.label { font-weight: bold; color: #555; width: 40%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ protocol }}://{{ domain }}{{ STATIC_URL }}images/logo-com-nome.png" alt="Logo {{ site_name }}">
        </div>
        <div class="content">
