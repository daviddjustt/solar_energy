<!DOCTYPE html>
<html>
<!-- O head (css) é igual ao anterior, para manter a consistência, usarei apenas a classe 'box' laranja aqui -->
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; margin: 0; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; }
        .header { background-color: #1a365d; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 30px; }
        .box { background: #fffaf0; padding: 15px; border-left: 4px solid #dd6b20; margin: 20px 0; border-radius: 4px; }
        .footer { font-size: 12px; color: #718096; text-align: center; padding: 20px; border-top: 1px solid #edf2f7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0;">Atualização de Status</h2>
        </div>
        <div class="content">
            <p>Olá,</p>
            <p>Ocorreu uma movimentação na solicitação <strong>#{{ servico.id }}</strong> ({{ servico.tipo.nome }}).</p>
            
            <div class="box">
                {{ mensagem }}
            </div>
            
            <p>Verifique o portal para acompanhar os próximos passos do serviço.</p>
        </div>
        <div class="footer">
            Este é um aviso automático. Por favor, não responda a este e-mail.
        </div>
    </div>
</body>
</html>
