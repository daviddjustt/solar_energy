<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
    }

    .wrapper {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e1e6eb;
    }

    .header-table {
      width: 100%;
      border-collapse: collapse;
      background-color: #0b2545;
    }

    .content {
      padding: 30px;
      color: #333333;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #888888;
      background-color: #f8f9fa;
      border-top: 1px solid #e1e6eb;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <table class="header-table" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b2545"
      style="background-color: #F0E68C;">
      <tr>
        <td align="center" bgcolor="#F0E68C" style="background-color: #F0E68C; padding: 25px; text-align: center;">
          <img src="https://solarenergy-production.up.railway.app/static/images/logo-com-nome.png"
               alt="Engenharia Solar"
               style="max-width: 200px; height: auto; display: inline-block; margin: 0 auto; vertical-align: middle;">
        </td>
      </tr>
    </table>

    <div class="content">
      {% block content %}{% endblock %}
    </div>

    <div class="footer">
      <p>Este é um e-mail automático enviado pelo SNTec Solar.</p>
      <p>© Todos os direitos reservados.</p>
    </div>
  </div>
</body>

</html>
